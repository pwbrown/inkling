name: Deploy

# Publishes the game to GitHub Pages on every push to main (REQUIREMENTS §12),
# at https://inkykeys.com/. It can also be run by hand from the Actions tab
# ("Run workflow").
# One-time setup: repo Settings → Pages → Source: "GitHub Actions", and
# Custom domain: inkykeys.com (with Enforce HTTPS). The custom domain is set
# there, not with a CNAME file, which Actions deploys ignore.
# The site is served from the domain's root, so the build uses the default
# base path `/`. To serve it from https://pwbrown.github.io/inky-keys/ again,
# remove the custom domain and set INKY_KEYS_BASE: /inky-keys/ on the build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
