name: Deploy

# Publishes the game to GitHub Pages (REQUIREMENTS §12).
#
# Manual for now, while the hosting platform is undecided: run it from the
# Actions tab ("Run workflow"). It needs Settings → Pages → Source set to
# "GitHub Actions" first. To deploy on every push again, add:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for the Pages project path
        run: npm run build
        env:
          INKLING_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
