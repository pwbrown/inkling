name: Release

# Turns a pushed version tag (made by `npm run release:tag`, see
# docs/RELEASING.md) into a GitHub Release whose notes are the tag message.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "Inky Keys ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
